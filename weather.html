<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #74b9ff 0%, #0984e3 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        .title {
            font-size: 2rem;
            color: #2d3436;
            margin-bottom: 1.5rem;
            font-weight: bold;
        }

        .search-container {
            display: flex;
            margin-bottom: 2rem;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .location-input {
            flex: 1;
            padding: 15px 20px;
            border: none;
            outline: none;
            font-size: 1rem;
            background: white;
        }

        .search-btn {
            padding: 15px 25px;
            background: linear-gradient(135deg, #00b894, #00a085);
            color: white;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .search-btn:hover {
            background: linear-gradient(135deg, #00a085, #00b894);
            transform: translateY(-2px);
        }

        .weather-info {
            display: none;
            animation: fadeInUp 0.6s ease;
        }

        .weather-info.show {
            display: block;
        }

        .location-name {
            font-size: 1.5rem;
            color: #2d3436;
            margin-bottom: 1rem;
            font-weight: bold;
        }

        .temperature {
            font-size: 4rem;
            color: #0984e3;
            font-weight: bold;
            margin: 1rem 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .weather-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .detail-card {
            background: linear-gradient(135deg, #f8f9ff, #e8f1ff);
            padding: 1rem;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        .detail-label {
            font-size: 0.9rem;
            color: #636e72;
            margin-bottom: 0.5rem;
        }

        .detail-value {
            font-size: 1.2rem;
            color: #2d3436;
            font-weight: bold;
        }

        .weather-icon {
            width: 80px;
            height: 80px;
            margin: 1rem auto;
            border-radius: 50%;
            background: linear-gradient(135deg, #ffecd2, #fcb69f);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
        }

        .condition {
            font-size: 1.2rem;
            color: #636e72;
            margin-bottom: 1rem;
            font-style: italic;
        }

        .loading {
            display: none;
            color: #74b9ff;
            font-size: 1.1rem;
            margin: 1rem 0;
        }

        .loading.show {
            display: block;
        }

        .error {
            display: none;
            color: #e74c3c;
            background: rgba(231, 76, 60, 0.1);
            padding: 1rem;
            border-radius: 10px;
            margin: 1rem 0;
        }

        .error.show {
            display: block;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1.5rem;
            }
            
            .temperature {
                font-size: 3rem;
            }
            
            .weather-details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">🌤️ Weather App</h1>
        
        <div class="search-container">
            <input type="text" class="location-input" placeholder="Enter city name..." id="locationInput">
            <button class="search-btn" onclick="getWeather()">Search</button>
        </div>
        
        <div class="loading" id="loading">🔄 Getting weather data...</div>
        <div class="error" id="error"></div>
        
        <div class="weather-info" id="weatherInfo">
            <div class="location-name" id="locationName"></div>
            <div class="weather-icon" id="weatherIcon">☀️</div>
            <div class="condition" id="condition"></div>
            <div class="temperature" id="temperature"></div>
            
            <div class="weather-details">
                <div class="detail-card">
                    <div class="detail-label">Feels Like</div>
                    <div class="detail-value" id="feelsLike"></div>
                </div>
                <div class="detail-card">
                    <div class="detail-label">Humidity</div>
                    <div class="detail-value" id="humidity"></div>
                </div>
                <div class="detail-card">
                    <div class="detail-label">Wind Speed</div>
                    <div class="detail-value" id="windSpeed"></div>
                </div>
                <div class="detail-card">
                    <div class="detail-label">Air Quality</div>
                    <div class="detail-value" id="airQuality"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = '0eee374d658045f1b2c65138251509';
        const BASE_URL = 'http://api.weatherapi.com/v1/current.json';

        // Get weather icon emoji based on condition
        function getWeatherIcon(condition) {
            const conditionLower = condition.toLowerCase();
            if (conditionLower.includes('sunny') || conditionLower.includes('clear')) return '☀️';
            if (conditionLower.includes('cloud')) return '☁️';
            if (conditionLower.includes('rain')) return '🌧️';
            if (conditionLower.includes('snow')) return '❄️';
            if (conditionLower.includes('thunder')) return '⛈️';
            if (conditionLower.includes('mist') || conditionLower.includes('fog')) return '🌫️';
            return '🌤️';
        }

        // Get air quality description
        function getAirQualityText(aqiIndex) {
            switch(aqiIndex) {
                case 1: return 'Good';
                case 2: return 'Moderate';
                case 3: return 'Unhealthy for Sensitive';
                case 4: return 'Unhealthy';
                case 5: return 'Very Unhealthy';
                case 6: return 'Hazardous';
                default: return 'Unknown';
            }
        }

        async function getWeather() {
            const locationInput = document.getElementById('locationInput');
            const location = locationInput.value.trim();
            
            if (!location) {
                showError('Please enter a city name');
                return;
            }

            showLoading(true);
            hideError();
            hideWeatherInfo();

            try {
                const response = await fetch(`${BASE_URL}?key=${API_KEY}&q=${encodeURIComponent(location)}&aqi=yes`);
                
                if (!response.ok) {
                    throw new Error('Location not found');
                }

                const data = await response.json();
                displayWeather(data);
                
            } catch (error) {
                showError('Unable to fetch weather data. Please check the city name and try again.');
                console.error('Error fetching weather:', error);
            } finally {
                showLoading(false);
            }
        }

        function displayWeather(data) {
            const { location, current } = data;
            
            // Update location name
            document.getElementById('locationName').textContent = `${location.name}, ${location.country}`;
            
            // Update weather icon
            document.getElementById('weatherIcon').textContent = getWeatherIcon(current.condition.text);
            
            // Update condition
            document.getElementById('condition').textContent = current.condition.text;
            
            // Update temperature
            document.getElementById('temperature').textContent = `${Math.round(current.temp_c)}°C`;
            
            // Update weather details
            document.getElementById('feelsLike').textContent = `${Math.round(current.feelslike_c)}°C`;
            document.getElementById('humidity').textContent = `${current.humidity}%`;
            document.getElementById('windSpeed').textContent = `${current.wind_kph} km/h`;
            
            // Update air quality
            const aqiText = current.air_quality ? getAirQualityText(current.air_quality['us-epa-index']) : 'N/A';
            document.getElementById('airQuality').textContent = aqiText;
            
            showWeatherInfo();
        }

        function showWeatherInfo() {
            document.getElementById('weatherInfo').classList.add('show');
        }

        function hideWeatherInfo() {
            document.getElementById('weatherInfo').classList.remove('show');
        }

        function showLoading(show) {
            document.getElementById('loading').classList.toggle('show', show);
        }

        function showError(message) {
            const errorElement = document.getElementById('error');
            errorElement.textContent = message;
            errorElement.classList.add('show');
        }

        function hideError() {
            document.getElementById('error').classList.remove('show');
        }

        // Allow Enter key to search
        document.getElementById('locationInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                getWeather();
            }
        });

        // Load default weather for London on page load
        window.onload = function() {
            document.getElementById('locationInput').value = 'London';
            getWeather();
        };
    </script>
</body>
</html>
